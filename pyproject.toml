[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openbb-eodhd"
version = "0.1.0"
description = "EODHD provider extension for OpenBB (equity historical pricing)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = ["openbb-core>=1.5.8"]

# Registers the `eodhd` provider with OpenBB's plugin system.
[project.entry-points."openbb_provider_extension"]
eodhd = "openbb_eodhd:eodhd_provider"

[tool.setuptools.packages.find]
include = ["openbb_eodhd*"]
